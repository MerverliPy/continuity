[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity"
version = "1.0.0"
description = "Preservation-first project intelligence and canonical handoffs for long-running work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
continuity = "continuity.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "jsonschema>=4,<5",
]

[tool.setuptools.packages.find]
where = ["skills/project-intelligence/scripts"]
include = ["continuity*"]

[tool.setuptools.package-data]
continuity = [
    "assets/schemas/*.json",
    "assets/templates/*.md",
    "assets/templates/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
